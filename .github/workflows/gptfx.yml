name: Build Android Common Kernel GPT

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      ack_branch:
        description: 'Android-common-kernel branch (e.g. common-android13-5.15)'
        required: true
        default: 'common-android13-5.15'
        type: string

      custom_kernel_repo:
        description: 'Custom kernel repository'
        required: true
        default: 'https://github.com/jkriyabd/device_xiaomi_gemstones-kernel'
        type: string

      custom_kernel_repo_branch:
        description: 'Custom kernel repository branch'
        required: true
        default: 'android13-5.15-lts'
        type: string

      use_latest_clang:
        description: 'Use the latest clang prebuilts (Check README!)'
        required: true
        default: true
        type: boolean

      anykernel_url_plus_branch:
        description: 'Space-separated AnyKernel3 fork URL + (Optional) Branch'
        required: true
        default: 'https://github.com/chickendrop89/AnyKernel3'
        type: string

      kernel_image_type:
        description: 'Kernel image to package (Image.gz, Image.lz4, etc)'
        required: true
        default: 'Image'
        type: string

      fast_build:
        description: 'Instruct tools to perform a Fast Build'
        required: true
        default: true
        type: boolean

      use_kleaf:
        description: 'Use the kleaf build system instead of build script'
        required: true
        default: false
        type: boolean

      extra_args:
        description: 'Extra arguments that will be passed to build system/script'
        required: false
        type: string

      build_configs:
        description: 'Space-separated list of build configurations'
        required: true
        default: 'build.config.gki.aarch64.chickernel build.config.gki.aarch64.chickernel.sukisu build.config.gki.aarch64.chickernel.sukisu.susfs'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_CONFIGS: ${{ github.event.inputs.build_configs }}
      IMAGE_TYPE: ${{ github.event.inputs.kernel_image_type }}
      ACK_BRANCH: ${{ github.event.inputs.ack_branch }}
      COMMON_REPO: ${{ github.event.inputs.custom_kernel_repo }}
      COMMON_REPO_BRANCH: ${{ github.event.inputs.custom_kernel_repo_branch }}
      AK3_GIT_URL_PLUS_BRANCH: ${{ github.event.inputs.anykernel_url_plus_branch }}
      AK3_DIR: ${{ github.workspace }}/kernel-build/anykernel3
      FINAL_DIR: ${{ github.workspace }}/kernel-build/final_images

    steps:

      # ============================================================
      # Validate workflow inputs
      # ============================================================

      - name: Validate inputs
        run: |
          set -e

          AK3_GIT_URL=$(echo "${AK3_GIT_URL_PLUS_BRANCH}" | awk '{print $1}')
          AK3_GIT_BRANCH=$(echo "${AK3_GIT_URL_PLUS_BRANCH}" | awk '{print $2}')

          echo "AK3_GIT_URL=${AK3_GIT_URL}" >> "${GITHUB_ENV}"
          echo "AK3_GIT_BRANCH=${AK3_GIT_BRANCH}" >> "${GITHUB_ENV}"

          validate_url() {
            if [[ ! "$1" =~ ^https://.+/.+/.+$ ]]; then
              echo "Invalid URL: $1"
              echo "URL must be a valid HTTPS git repository URL"
              exit 1
            fi
          }

          validate_url "${COMMON_REPO}"
          validate_url "${AK3_GIT_URL}"

          validate_single_word() {
            if [[ "$1" =~ [[:space:]] ]]; then
              echo "::error::Invalid $2: $1"
              echo "$2 must be a single word without spaces"
              exit 1
            fi
          }

          validate_single_word "${ACK_BRANCH}" \
            "Android-common-kernel branch"

          validate_single_word "${COMMON_REPO_BRANCH}" \
            "Custom Kernel repo branch"

          if [ -n "${AK3_GIT_BRANCH}" ]; then
            validate_single_word "${AK3_GIT_BRANCH}" \
              "AnyKernel3 fork branch"
          fi

          validate_single_word "${IMAGE_TYPE}" \
            "Kernel image type"


      # ============================================================
      # Setup local manifest
      # ============================================================

      - name: Setup build workspace and a local manifest
        env:
          USE_LATEST_CLANG: ${{ github.event.inputs.use_latest_clang }}
          CUSTOM_MANIFEST: .repo/local_manifests/custom.xml

        run: |
          set -e

          REPO_SOURCE=$(echo "${COMMON_REPO}" | cut -d'/' -f3)
          REPO_OWNER=$(echo "${COMMON_REPO}" | cut -d'/' -f4)
          REPO_NAME=$(echo "${COMMON_REPO}" | cut -d'/' -f5)

          mkdir kernel-build
          cd kernel-build

          mkdir -p .repo/local_manifests

          mecho() {
            echo "$1" >> "${CUSTOM_MANIFEST}"
          }

          mecho '<?xml version="1.0" encoding="UTF-8"?>'
          mecho '<manifest>'
          mecho "  <remote name=\"common-repo\" fetch=\"https://${REPO_SOURCE}/${REPO_OWNER}\" />"
          mecho ''
          mecho '  <remove-project name="kernel/common" />'
          mecho "  <project path=\"common\" name=\"${REPO_NAME}\" remote=\"common-repo\" revision=\"${COMMON_REPO_BRANCH}\" >"
          mecho '    <linkfile src="." dest=".source_date_epoch_dir" />'
          mecho '  </project>'

          if [ "${USE_LATEST_CLANG}" = true ]; then
            mecho '  <remove-project name="platform/prebuilts/clang/host/linux-x86" />'
            mecho '  <project path="prebuilts/clang/host/linux-x86" name="platform/prebuilts/clang/host/linux-x86" revision="main" clone-depth="1" />'
          fi

          mecho '</manifest>'


      # ============================================================
      # Download repo + clone AnyKernel3
      # ============================================================

      - name: Download build utilities
        working-directory: kernel-build

        run: |
          set -e

          if [ -z "${AK3_GIT_BRANCH}" ]; then
            git clone --depth=1 \
              "${AK3_GIT_URL}" \
              "${AK3_DIR}"
          else
            git clone --depth=1 \
              "${AK3_GIT_URL}" \
              "${AK3_DIR}" \
              -b "${AK3_GIT_BRANCH}"
          fi

          mkdir -p ~/.bin

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/.bin/repo

          chmod a+rx ~/.bin/repo

          echo "${HOME}/.bin" >> "${GITHUB_PATH}"


      # ============================================================
      # Free runner disk space
      # ============================================================

      - name: Clean up container
        uses: rokibhasansagar/slimhub_actions@main


      # ============================================================
      # Initialize Android Common Kernel
      # ============================================================

      - name: Initialize the manifest, and sync
        working-directory: kernel-build

        run: |
          set -e

          repo init \
            --no-tags \
            --depth=1 \
            --dissociate \
            -u https://android.googlesource.com/kernel/manifest \
            -b "${ACK_BRANCH}"

          repo sync \
            --no-tags \
            --clone-bundle \
            --current-branch \
            --optimized-fetch \
            --force-sync \
            --fetch-submodules \
            -j"$(nproc --all)"


      # ============================================================
      # SukiSU Ultra
      # ============================================================

      - name: Clone SukiSU Ultra
        working-directory: kernel-build

        run: |
          set -e

          rm -rf common/KernelSU-Next

          git clone \
            --depth=1 \
            https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
            common/KernelSU-Next


      # ============================================================
      # RTL8812AU v5.6.4.2
      # ============================================================

      - name: Add RTL8812AU driver
        working-directory: kernel-build

        run: |
          set -e

          DRV="common/drivers/net/wireless/rtl8812au"

          echo "========================================"
          echo "Cloning RTL8812AU v5.6.4.2"
          echo "========================================"

          rm -rf "$DRV"

          git clone \
            --depth=1 \
            -b v5.6.4.2 \
            https://github.com/aircrack-ng/rtl8812au \
            "$DRV"

          rm -rf "$DRV/.git"


          # --------------------------------------------------------
          # Driver Makefile
          # --------------------------------------------------------

          sed -i \
            's/^CONFIG_PLATFORM_I386_PC *=.*/CONFIG_PLATFORM_I386_PC = n/' \
            "$DRV/Makefile"

          sed -i \
            's/^obj-\$(CONFIG_[A-Za-z0-9_]*) *[:+]*= *\$(MODULE_NAME)\.o/obj-$(CONFIG_88XXAU) += $(MODULE_NAME).o/' \
            "$DRV/Makefile"

          sed -i \
            's/-Wno-stringop-overread//g; s/-Wno-stringop-overflow//g; s/-Wno-maybe-uninitialized//g' \
            "$DRV/Makefile"

          echo 'EXTRA_CFLAGS += -Wno-error' >> "$DRV/Makefile"

          echo "--- RTL8812AU Makefile ---"

          grep -nE \
            'CONFIG_PLATFORM_I386_PC|obj-\$\(CONFIG_88XXAU\)|EXTRA_CFLAGS' \
            "$DRV/Makefile" || true

          if ! grep -q \
            'obj-$(CONFIG_88XXAU)' \
            "$DRV/Makefile"
          then
            echo "ERROR: driver Makefile obj line not patched"
            grep -n 'obj-' "$DRV/Makefile" || true
            exit 1
          fi


          # --------------------------------------------------------
          # Kconfig
          # --------------------------------------------------------

          printf '%s\n' \
            'config 88XXAU' \
            '	tristate "Realtek 8812A/8821A USB WiFi (aircrack-ng)"' \
            '	depends on USB' \
            > "$DRV/Kconfig"

          echo 'source "drivers/net/wireless/rtl8812au/Kconfig"' \
            >> common/drivers/net/wireless/Kconfig

          echo 'obj-$(CONFIG_88XXAU) += rtl8812au/' \
            >> common/drivers/net/wireless/Makefile


          # --------------------------------------------------------
          # Remove stale auth block
          # --------------------------------------------------------

          python3 - "$DRV/core/rtw_ap.c" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          text = p.read_text()

          pattern = (
              r'\s*if\s*\(\s*\(\s*psta\s*->\s*auth_len\s*!=\s*0\s*\)'
              r'\s*&&\s*\(\s*psta\s*->\s*pauth_frame\s*!=\s*NULL\s*\)'
              r'\s*\)\s*\{.*?\n\s*\}'
          )

          text, count = re.subn(
              pattern,
              '',
              text,
              flags=re.DOTALL
          )

          if count:
              p.write_text(text)
              print(f"Removed stale auth block from {p}")
          else:
              print(f"No stale auth block found in {p}")
          PY

          grep -n \
            'auth_len\|pauth_frame' \
            "$DRV/core/rtw_ap.c" || true


          # --------------------------------------------------------
          # wiphy_net compatibility
          # --------------------------------------------------------

          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              'common/drivers/net/wireless/rtl8812au/os_dep/linux/os_intfs.c'
          )

          text = p.read_text()

          old = (
              "dev_net_set(ndev, "
              "wiphy_net(adapter_to_wiphy(adapter)));"
          )

          new = """#if defined(CONFIG_CFG80211) && defined(wiphy_net)
          	dev_net_set(ndev, wiphy_net(adapter_to_wiphy(adapter)));
          #else
          	dev_net_set(ndev, &init_net);
          #endif"""

          if old in text:
              text = text.replace(old, new)
              p.write_text(text)
              print(
                  "Patched rtl8812au net namespace compatibility block"
              )
          else:
              print(
                  "No legacy rtl8812au wiphy_net call found; "
                  "skipping compatibility patch"
              )
          PY


          # --------------------------------------------------------
          # NL80211_AUTHTYPE_SAE compatibility
          # --------------------------------------------------------

          if [ -f "$DRV/include/rtw_mlme_ext.h" ]; then

            sed -i \
              '/^#ifndef NL80211_AUTHTYPE_SAE/,/^#endif/d' \
              "$DRV/include/rtw_mlme_ext.h"

            grep -n \
              'NL80211_AUTHTYPE_SAE' \
              "$DRV/include/rtw_mlme_ext.h" || true

          fi

          if [ -f "$DRV/core/rtw_ap.c" ]; then

            grep -RIn \
              'NL80211_AUTHTYPE_SAE' \
              "$DRV" || true

            grep -RIl \
              'NL80211_AUTHTYPE_SAE' \
              "$DRV" |
            while IFS= read -r f; do
              sed -i \
                's/NL80211_AUTHTYPE_SAE/0/g' \
                "$f"
            done

          fi


          # --------------------------------------------------------
          # Kernel config
          # --------------------------------------------------------

          FILES=$(
            grep -rl \
              'CONFIG_LOCALVERSION="-chickernel' \
              common/arch/arm64/configs \
              common/*.config* \
              2>/dev/null || true
          )

          [ -n "$FILES" ] || {
            echo "ERROR: no chickernel config file found"
            exit 1
          }

          for CFG in $FILES; do

            echo "Patching config: $CFG"

            sed -i \
              '/^# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/d' \
              "$CFG"

            sed -i \
              '/^CONFIG_88XXAU=/d' \
              "$CFG"

            sed -i \
              '/^CONFIG_CFG80211=/d' \
              "$CFG"

            printf '\nCONFIG_88XXAU=m\nCONFIG_CFG80211=y\nCONFIG_SECTION_MISMATCH_WARN_ONLY=y\n' \
              >> "$CFG"

          done


          echo
          echo "========================================"
          echo "RTL8812AU configuration"
          echo "========================================"

          grep -rn \
            "88XXAU" \
            common/drivers/net/wireless/Makefile \
            "$DRV/Kconfig" \
            $FILES

          grep -n \
            "rtl8812au" \
            common/drivers/net/wireless/Kconfig


      # ============================================================
      # Disable legacy direct filesystem APIs
      #
      # IMPORTANT:
      #
      # RTL8812AU v5.6.4.2 contains:
      #
      #   openFile()
      #   closeFile()
      #   readFile()
      #   writeFile()
      #   isFileReadable()
      #   retriveFromFile()
      #   storeToFile()
      #
      # The original implementations reference:
      #
      #   filp_open()
      #   kernel_read()
      #   kernel_write()
      #
      # Android GKI rejects those direct driver filesystem symbols.
      #
      # This patch replaces the functions individually instead of
      # relying on one exact comment marker.
      # ============================================================

      - name: Disable RTL8812AU direct file I/O
        working-directory: kernel-build

        run: |
          set -e

          FILE="common/drivers/net/wireless/rtl8812au/os_dep/osdep_service.c"

          echo "========================================"
          echo "Patching RTL8812AU filesystem helpers"
          echo "========================================"

          test -f "$FILE"


          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()


          def replace_function(source, name, replacement):
              """
              Replace a C function definition by finding its opening
              brace and matching braces. This avoids depending on
              comments or exact whitespace.
              """

              pattern = re.compile(
                  rf'(?ms)'
                  rf'^[ \t]*'
                  rf'(?:static\s+)?'
                  rf'(?:inline\s+)?'
                  rf'int\s+{re.escape(name)}\s*\([^;]*\)\s*\{{'
              )

              match = pattern.search(source)

              if not match:
                  raise RuntimeError(
                      f"Function not found: {name}"
                  )

              brace_start = source.find(
                  '{',
                  match.start(),
                  match.end()
              )

              if brace_start < 0:
                  raise RuntimeError(
                      f"Opening brace not found: {name}"
                  )

              depth = 0
              i = brace_start

              in_string = False
              in_char = False
              in_line_comment = False
              in_block_comment = False
              escaped = False

              while i < len(source):

                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''

                  if in_line_comment:
                      if c == '\n':
                          in_line_comment = False
                      i += 1
                      continue

                  if in_block_comment:
                      if c == '*' and n == '/':
                          in_block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if in_string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          in_string = False
                      i += 1
                      continue

                  if in_char:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == "'":
                          in_char = False
                      i += 1
                      continue

                  if c == '/' and n == '/':
                      in_line_comment = True
                      i += 2
                      continue

                  if c == '/' and n == '*':
                      in_block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      in_string = True
                      i += 1
                      continue

                  if c == "'":
                      in_char = True
                      i += 1
                      continue

                  if c == '{':
                      depth += 1

                  elif c == '}':
                      depth -= 1

                      if depth == 0:
                          end = i + 1

                          return (
                              source[:match.start()]
                              + replacement
                              + source[end:]
                          )

                  i += 1

              raise RuntimeError(
                  f"Unbalanced braces while replacing: {name}"
              )


          replacements = {

              "openFile": """static int openFile(
          	struct file **fpp,
          	const char *path,
          	int flag,
          	int mode
          )
          {
          	(void)fpp;
          	(void)path;
          	(void)flag;
          	(void)mode;

          	return -EOPNOTSUPP;
          }""",

              "closeFile": """static int closeFile(struct file *fp)
          {
          	(void)fp;
          	return 0;
          }""",

              "readFile": """static int readFile(
          	struct file *fp,
          	char *buf,
          	int len
          )
          {
          	(void)fp;
          	(void)buf;
          	(void)len;

          	return -EOPNOTSUPP;
          }""",

              "writeFile": """static int writeFile(
          	struct file *fp,
          	char *buf,
          	int len
          )
          {
          	(void)fp;
          	(void)buf;
          	(void)len;

          	return -EOPNOTSUPP;
          }""",

              "isFileReadable": """static int isFileReadable(
          	const char *path,
          	u32 *sz
          )
          {
          	(void)path;

          	if (sz)
          		*sz = 0;

          	return -EOPNOTSUPP;
          }""",

              "retriveFromFile": """static int retriveFromFile(
          	const char *path,
          	u8 *buf,
          	u32 sz
          )
          {
          	(void)path;
          	(void)buf;
          	(void)sz;

          	return -EOPNOTSUPP;
          }""",

              "storeToFile": """static int storeToFile(
          	const char *path,
          	u8 *buf,
          	u32 sz
          )
          {
          	(void)path;
          	(void)buf;
          	(void)sz;

          	return -EOPNOTSUPP;
          }""",
          }


          for name, replacement in replacements.items():

              text = replace_function(
                  text,
                  name,
                  replacement
              )

              print(
                  f"Patched function: {name}"
              )


          path.write_text(text)

          print()
          print(
              "RTL8812AU filesystem helper functions "
              "successfully replaced."
          )
          PY


          echo
          echo "========================================"
          echo "Forbidden symbol check"
          echo "========================================"

          if grep -RInE \
            '\b(filp_open|kernel_read|kernel_write)\s*\(' \
            common/drivers/net/wireless/rtl8812au
          then
            echo
            echo "ERROR: forbidden GKI file-I/O call remains"
            exit 1
          fi

          echo "OK: no forbidden direct file-I/O calls remain"


      # ============================================================
      # Verify entire RTL8812AU tree
      # ============================================================

      - name: Verify RTL8812AU forbidden symbols
        working-directory: kernel-build

        run: |
          set -e

          DRV="common/drivers/net/wireless/rtl8812au"

          echo "========================================"
          echo "RTL8812AU source verification"
          echo "========================================"

          if grep -RInE \
            '\b(filp_open|kernel_read|kernel_write)\s*\(' \
            "$DRV"
          then
            echo
            echo "ERROR: forbidden GKI filesystem API found"
            exit 1
          fi

          echo "OK: source tree is free of forbidden calls"


      # ============================================================
      # KMI ABI symbol list
      #
      # DO NOT add:
      #
      #   filp_open
      #   kernel_read
      #   kernel_write
      #
      # They are explicitly rejected by GKI.
      # ============================================================

      - name: Fix RTL8812AU KMI symbol list
        working-directory: kernel-build

        run: |
          set -e

          SYMBOL_LIST="common/android/abi_gki_aarch64"

          if [ ! -f "$SYMBOL_LIST" ]; then
            echo "ERROR: KMI symbol list not found:"
            echo "$SYMBOL_LIST"
            exit 1
          fi

          REQUIRED_SYMBOLS="
          ieee80211_radiotap_iterator_init
          "

          for symbol in $REQUIRED_SYMBOLS; do

            if grep -qxF \
              "$symbol" \
              "$SYMBOL_LIST"
            then
              echo "Already present: $symbol"
            else
              printf '%s\n' "$symbol" \
                >> "$SYMBOL_LIST"

              echo "Added KMI symbol: $symbol"
            fi

          done


          echo
          echo "========================================"
          echo "Checking forbidden KMI symbols"
          echo "========================================"

          if grep -nE \
            '^(filp_open|kernel_read|kernel_write)$' \
            "$SYMBOL_LIST"
          then
            echo
            echo "ERROR: forbidden symbol exists in KMI list"
            exit 1
          fi

          echo "OK: forbidden symbols are absent"


      # ============================================================
      # Final pre-build sanity check
      # ============================================================

      - name: Final RTL8812AU pre-build check
        working-directory: kernel-build

        run: |
          set -e

          DRV="common/drivers/net/wireless/rtl8812au"

          echo "========================================"
          echo "Final RTL8812AU pre-build check"
          echo "========================================"

          test -f "$DRV/Makefile"
          test -f "$DRV/Kconfig"
          test -f "$DRV/os_dep/osdep_service.c"

          grep -q \
            'obj-$(CONFIG_88XXAU)' \
            "$DRV/Makefile"

          grep -q \
            'config 88XXAU' \
            "$DRV/Kconfig"

          if grep -RInE \
            '\b(filp_open|kernel_read|kernel_write)\s*\(' \
            "$DRV"
          then
            echo "ERROR: forbidden API remains"
            exit 1
          fi

          echo
          echo "RTL8812AU is ready for kernel build."


      # ============================================================
      # Build kernel(s)
      # ============================================================

      - name: Build, and process the kernel(s)
        working-directory: kernel-build

        env:
          EXTRA_ARGS: ${{ github.event.inputs.extra_args }}
          FAST_BUILD: ${{ github.event.inputs.fast_build }}
          USE_KLEAF: ${{ github.event.inputs.use_kleaf }}
          OUT_DIR: ${{ github.workspace }}/kernel-build/out
          OUT_BAZEL_DIR: ${{ github.workspace }}/kernel-build/bazel-bin/common

        run: |
          set -e

          mkdir -p "${FINAL_DIR}"

          for config in ${BUILD_CONFIGS}; do

            echo
            echo "========================================"
            echo "Building kernel config: ${config}"
            echo "========================================"

            if [ "${USE_KLEAF}" = true ]; then

              if [ "${FAST_BUILD}" = true ]; then

                tools/bazel build \
                  ${EXTRA_ARGS} \
                  --config=fast \
                  "//common:${config}"

              else

                tools/bazel build \
                  ${EXTRA_ARGS} \
                  "//common:${config}"

              fi

              if [ -f \
                "${OUT_BAZEL_DIR}/${config}/${IMAGE_TYPE}"
              ]; then

                sudo chmod 777 -R \
                  "${OUT_BAZEL_DIR}/${config}"

                mv \
                  "${OUT_BAZEL_DIR}/${config}/${IMAGE_TYPE}" \
                  "${FINAL_DIR}/${IMAGE_TYPE}-${config}"

              else

                echo "ERROR: Output image not found for ${config}"
                exit 1

              fi

            else

              BUILD_CONFIG="common/${config}" \
                bash build/build.sh ${EXTRA_ARGS}

              if [ -f \
                "${OUT_DIR}/dist/${IMAGE_TYPE}"
              ]; then

                mv \
                  "${OUT_DIR}/dist/${IMAGE_TYPE}" \
                  "${FINAL_DIR}/${IMAGE_TYPE}-${config}"

              else

                echo "ERROR: Output image not found for ${config}"
                exit 1

              fi

            fi

          done


      # ============================================================
      # Verify RTL8812AU .ko
      # ============================================================

      - name: Verify generated RTL8812AU module
        working-directory: kernel-build

        run: |
          set -e

          echo "========================================"
          echo "Searching for 88XXau.ko"
          echo "========================================"

          KO=$(find out \
            -type f \
            -name '88XXau.ko' \
            | head -n1)

          if [ -z "$KO" ]; then

            echo "ERROR: 88XXau.ko was not built"

            echo
            echo "Searching for RTL8812AU modules:"

            find out \
              -type f \
              \( \
                -name '*88XXau*.ko' \
                -o \
                -name '*8812au*.ko' \
              \) \
              -print || true

            exit 1
          fi

          echo "Found:"
          echo "$KO"

          mkdir -p "${FINAL_DIR}"

          cp \
            "$KO" \
            "${FINAL_DIR}/88XXau.ko"

          echo
          echo "========================================"
          echo "RTL8812AU module info"
          echo "========================================"

          modinfo \
            "${FINAL_DIR}/88XXau.ko" \
            | head -n 20 || true


      # ============================================================
      # Package RTL8812AU into AnyKernel3
      #
      # AnyKernel3 do.modules=1 installs .ko files from modules/
      # to the corresponding filesystem location.
      #
      # vendor/lib/modules/88XXau.ko
      # ->
      # /vendor/lib/modules/88XXau.ko
      #
      # The .ko is ALSO uploaded separately as an artifact.
      # ============================================================

      - name: Package RTL8812AU module into AnyKernel3
        working-directory: kernel-build

        run: |
          set -e

          KO="${FINAL_DIR}/88XXau.ko"

          if [ ! -f "$KO" ]; then
            echo "ERROR: 88XXau.ko not found"
            exit 1
          fi

          echo "========================================"
          echo "Preparing AnyKernel3 RTL8812AU module"
          echo "========================================"

          mkdir -p \
            "${AK3_DIR}/modules/vendor/lib/modules"

          cp \
            "$KO" \
            "${AK3_DIR}/modules/vendor/lib/modules/88XXau.ko"

          chmod 644 \
            "${AK3_DIR}/modules/vendor/lib/modules/88XXau.ko"


          # Enable AnyKernel3 module installation.
          if grep -q \
            '^do.modules=' \
            "${AK3_DIR}/anykernel.sh"
          then

            sed -i \
              's/^do.modules=.*/do.modules=1/' \
              "${AK3_DIR}/anykernel.sh"

          else

            echo
            echo "WARNING: do.modules property not found."
            echo "Adding it to AnyKernel3 properties."

            sed -i \
              '/^properties()/,/^'\''; }/ {
                /^'\''; }/i\
            do.modules=1
              }' \
              "${AK3_DIR}/anykernel.sh"

          fi


          echo
          echo "--- AnyKernel3 module setting ---"

          grep -n \
            'do.modules' \
            "${AK3_DIR}/anykernel.sh" || true

          echo
          echo "--- Packaged module ---"

          ls -lh \
            "${AK3_DIR}/modules/vendor/lib/modules/88XXau.ko"


      # ============================================================
      # Package kernels with AnyKernel3
      # ============================================================

      - name: Package Kernels with AnyKernel3
        working-directory: kernel-build

        run: |
          set -e

          for config in ${BUILD_CONFIGS}; do

            if [ -f \
              "${FINAL_DIR}/${IMAGE_TYPE}-${config}"
            ]; then

              echo
              echo "========================================"
              echo "Packaging ${config}"
              echo "========================================"

              AK3_PACKAGE="${AK3_DIR}-${config}"

              rm -rf \
                "$AK3_PACKAGE"

              cp -r \
                "${AK3_DIR}" \
                "$AK3_PACKAGE"

              cp \
                "${FINAL_DIR}/${IMAGE_TYPE}-${config}" \
                "${AK3_PACKAGE}/${IMAGE_TYPE}"


              # ----------------------------------------------------
              # Verify RTL8812AU module is inside the ZIP source.
              # ----------------------------------------------------

              if [ ! -f \
                "${AK3_PACKAGE}/modules/vendor/lib/modules/88XXau.ko"
              ]; then

                echo "ERROR: 88XXau.ko missing from AnyKernel3 package"
                exit 1

              fi


              echo
              echo "--- AnyKernel3 package contents ---"

              ls -lh \
                "${AK3_PACKAGE}/modules/vendor/lib/modules/88XXau.ko"


              cd "$AK3_PACKAGE"

              zip -r9 \
                "${FINAL_DIR}/${config}.zip" \
                * \
                -x \
                .git \
                README.md \
                '*placeholder'

              cd ..

            fi

          done


      # ============================================================
      # Final artifact verification
      # ============================================================

      - name: Final artifact verification
        working-directory: kernel-build

        run: |
          set -e

          echo "========================================"
          echo "Final artifacts"
          echo "========================================"

          ls -lh \
            "${FINAL_DIR}"


          test -f \
            "${FINAL_DIR}/88XXau.ko"


          if ! find \
            "${FINAL_DIR}" \
            -maxdepth 1 \
            -name '*.zip' \
            -type f \
            | grep -q .
          then
            echo "ERROR: no kernel ZIP produced"
            exit 1
          fi


          echo
          echo "========================================"
          echo "Final RTL8812AU module"
          echo "========================================"

          modinfo \
            "${FINAL_DIR}/88XXau.ko" \
            | head -n 20 || true


          echo
          echo "========================================"
          echo "Done"
          echo "========================================"


      # ============================================================
      # Upload artifacts
      # ============================================================

      - name: Upload Kernel Packages
        uses: actions/upload-artifact@v4

        with:
          name: kernel-packages

          path: |
            kernel-build/final_images/*.zip
            kernel-build/final_images/*.ko

          if-no-files-found: error
          retention-days: 30
