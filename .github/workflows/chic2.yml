name: Build Android Common Kernel CL

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      ack_branch:
        description: 'Android-common-kernel branch (e.g. common-android13-5.15)'
        required: true
        default: 'common-android13-5.15'
        type: string
      custom_kernel_repo:
        description: 'Custom kernel repository'
        required: true
        default: 'https://github.com/jkriyabd/device_xiaomi_gemstones-kernel'
        type: string
      custom_kernel_repo_branch:
        description: 'Custom kernel repository branch'
        required: true
        default: 'android13-5.15-lts'
        type: string
      use_latest_clang:
        description: 'Use the latest clang prebuilts (Check README!)'
        required: true
        default: true
        type: boolean
      anykernel_url_plus_branch:
        description: 'Space-separated AnyKernel3 fork URL + (Optional) Branch'
        required: true
        default: 'https://github.com/chickendrop89/AnyKernel3'
        type: string
      kernel_image_type:
        description: 'Kernel image to package (Image.gz, Image.lz4, etc)'
        required: true
        default: 'Image'
      fast_build:
        description: 'Instruct tools to perform a Fast Build'
        required: true
        default: true
        type: boolean
      use_kleaf:
        description: 'Use the kleaf build system instead of build script'
        required: true
        default: false
        type: boolean
      extra_args:
        description: 'Extra arguments that will be passed to build system/script'
        required: false
      build_configs:
        description: 'Space-separated list of build configurations'
        required: true
        default: 'build.config.gki.aarch64.chickernel build.config.gki.aarch64.chickernel.sukisu build.config.gki.aarch64.chickernel.sukisu.susfs'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGS: ${{ github.event.inputs.build_configs }}
      IMAGE_TYPE: ${{ github.event.inputs.kernel_image_type }}

      ACK_BRANCH: ${{ github.event.inputs.ack_branch }}
      COMMON_REPO: ${{ github.event.inputs.custom_kernel_repo }}
      COMMON_REPO_BRANCH: ${{ github.event.inputs.custom_kernel_repo_branch }}
      AK3_GIT_URL_PLUS_BRANCH: ${{ github.event.inputs.anykernel_url_plus_branch }}

      AK3_DIR: ${{ github.workspace }}/kernel-build/anykernel3
      FINAL_DIR: ${{ github.workspace }}/kernel-build/final_images

    steps:
      - name: Validate inputs
        run: |
          AK3_GIT_URL=$(echo "${AK3_GIT_URL_PLUS_BRANCH}" | awk '{print $1}')
          AK3_GIT_BRANCH=$(echo "${AK3_GIT_URL_PLUS_BRANCH}" | awk '{print $2}')

          # Export these variables while we're at it
          echo "AK3_GIT_URL=${AK3_GIT_URL}" >> ${GITHUB_ENV}
          echo "AK3_GIT_BRANCH=${AK3_GIT_BRANCH}" >> ${GITHUB_ENV}

          validate_url() {
            if [[ ! "$1" =~ ^https://.+/.+/.+$ ]]; 
              then
                echo "Invalid URL: $1"
                echo "URL must be a valid HTTPS git repository URL"
                exit 1
              fi
          }

          validate_url ${COMMON_REPO}
          validate_url ${AK3_GIT_URL}

          validate_single_word() {
            if [[ "$1" =~ [[:space:]] ]]; 
              then
                echo "::error::Invalid $2: $1"
                echo "$2 must be a single word without spaces"
                exit 1
              fi
          }

          validate_single_word "${ACK_BRANCH}" \
          "Android-common-kernel branch"

          validate_single_word "${COMMON_REPO_BRANCH}" \
          "Custom Kernel repo branch"

          if [ ! -z "${AK3_GIT_BRANCH}" ]; 
            then 
              validate_single_word "${AK3_GIT_BRANCH}" \
              "AnyKernel3 fork branch"
          fi

          validate_single_word "${IMAGE_TYPE}" \
          "Kernel image type"

      - name: Setup build workspace and a local manifest
        env:
          USE_LATEST_CLANG: ${{ github.event.inputs.use_latest_clang }}
          CUSTOM_MANIFEST: .repo/local_manifests/custom.xml
        run: |
          REPO_SOURCE=$(echo ${COMMON_REPO} | cut -d'/' -f3)
          REPO_OWNER=$(echo ${COMMON_REPO} | cut -d'/' -f4)
          REPO_NAME=$(echo ${COMMON_REPO} | cut -d'/' -f5)

          mkdir kernel-build && cd $_
          mkdir -p .repo/local_manifests

          mecho() {
            echo "$1" >> "${CUSTOM_MANIFEST}"
          }

          mecho '<?xml version="1.0" encoding="UTF-8"?>'
          mecho '<manifest>'
          mecho "  <remote name=\"common-repo\" fetch=\"https://${REPO_SOURCE}/${REPO_OWNER}\" />"
          mecho ''
          mecho '  <remove-project name="kernel/common" />'
          mecho "  <project path=\"common\" name=\"${REPO_NAME}\" remote=\"common-repo\" revision=\"${COMMON_REPO_BRANCH}\" >"
          mecho '    <linkfile src="." dest=".source_date_epoch_dir" />'
          mecho '  </project>'

          if [ "${USE_LATEST_CLANG}" = true ]; then
            mecho '  <remove-project name="platform/prebuilts/clang/host/linux-x86" />'
            mecho '  <project path="prebuilts/clang/host/linux-x86" name="platform/prebuilts/clang/host/linux-x86" revision="main" clone-depth="1" />'
          fi

          mecho '</manifest>'

      - name: Download build utilities
        working-directory: kernel-build
        run: |
          if [ -z "${AK3_GIT_BRANCH}" ]
            then git clone --depth=1 ${AK3_GIT_URL} "${AK3_DIR}"
            else git clone --depth=1 ${AK3_GIT_URL} "${AK3_DIR}" -b ${AK3_GIT_BRANCH}
          fi

          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "${HOME}/.bin" >> ${GITHUB_PATH}

      - name: Clean up container
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize the manifest, and sync
        working-directory: kernel-build
        run: |
          repo init \
            --no-tags \
            --depth=1 \
            --dissociate \
            -u https://android.googlesource.com/kernel/manifest \
            -b ${ACK_BRANCH}

          repo sync \
            --no-tags \
            --clone-bundle \
            --current-branch \
            --optimized-fetch \
            --force-sync \
            --fetch-submodules \
            -j$(nproc --all)
      - name: Clone SukiSU Ultra
        working-directory: kernel-build
        run: |
          rm -rf common/KernelSU-Next
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git \
          common/KernelSU-Next

      - name: Add RTL8821AU driver
        working-directory: kernel-build
        run: |
          set -e
          DRV=common/drivers/net/wireless/rtl8812au

          git clone --depth=1 -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au "$DRV"
          rm -rf "$DRV/.git"

          sed -i 's/^CONFIG_PLATFORM_I386_PC *=.*/CONFIG_PLATFORM_I386_PC = n/' "$DRV/Makefile"
          sed -i 's/^obj-\$(CONFIG_[A-Za-z0-9_]*) *[:+]*= *\$(MODULE_NAME)\.o/obj-$(CONFIG_88XXAU) += $(MODULE_NAME).o/' "$DRV/Makefile"
          sed -i 's/-Wno-stringop-overread//g; s/-Wno-stringop-overflow//g; s/-Wno-maybe-uninitialized//g' "$DRV/Makefile"
          echo '--- remaining -W flags in driver Makefile ---'
          grep -n -- '-W' "$DRV/Makefile" || true
          echo 'EXTRA_CFLAGS += -Wno-error' >> "$DRV/Makefile"
          grep -q 'obj-$(CONFIG_88XXAU)' "$DRV/Makefile" || { echo "ERROR: driver Makefile obj line not patched"; grep -n 'obj-' "$DRV/Makefile"; exit 1; }

          printf 'config 88XXAU\n\ttristate "Realtek 8812A/8821A USB WiFi (aircrack-ng)"\n\tdepends on USB\n' > "$DRV/Kconfig"
          echo 'source "drivers/net/wireless/rtl8812au/Kconfig"' >> common/drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_88XXAU) += rtl8812au/' >> common/drivers/net/wireless/Makefile

          # rtl8812au v5.6.4.2 still contains stale sta_info members that were removed
          # in newer kernels. Strip that legacy cleanup block before build.
          python3 - "$DRV/core/rtw_ap.c" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          text = p.read_text()

          pattern = r'\s*if\s*\(\s*\(\s*psta\s*->\s*auth_len\s*!=\s*0\s*\)\s*&&\s*\(\s*psta\s*->\s*pauth_frame\s*!=\s*NULL\s*\)\s*\)\s*\{.*?\n\s*\}'
          text, count = re.subn(pattern, '', text, flags=re.DOTALL)

          if count:
              p.write_text(text)
              print(f"Removed stale auth block from {p}")
          else:
              print(f"No stale auth block found in {p}")
          PY
          grep -n 'auth_len\|pauth_frame' "$DRV/core/rtw_ap.c" || true

          # Newer kernels removed the legacy wiphy_net()/adapter->wiphy pattern used by
          # upstream rtl8812au. Guard it so the kernel build can proceed on 5.15-based trees.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('common/drivers/net/wireless/rtl8812au/os_dep/linux/os_intfs.c')
          text = p.read_text()

          old = "dev_net_set(ndev, wiphy_net(adapter_to_wiphy(adapter)));"
          new = """#if defined(CONFIG_CFG80211) && defined(wiphy_net)\n\tdev_net_set(ndev, wiphy_net(adapter_to_wiphy(adapter)));\n#else\n\tdev_net_set(ndev, &init_net);\n#endif"""

          if old in text:
              text = text.replace(old, new)
              p.write_text(text)
              print('Patched rtl8812au net namespace compatibility block')
          else:
      - name: Add RTL8812AU driver
        working-directory: kernel-build
        run: |
          set -e
          DRV=common/drivers/net/wireless/rtl8812au

          # 1. Fetch driver source
          git clone --depth=1 -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au "$DRV"
          rm -rf "$DRV/.git"

          # 2. Makefile: build as in-tree module, no extra warnings-as-errors
          sed -i 's/^CONFIG_PLATFORM_I386_PC *=.*/CONFIG_PLATFORM_I386_PC = n/' "$DRV/Makefile"
          sed -i 's/^obj-\$(CONFIG_[A-Za-z0-9_]*) *[:+]*= *\$(MODULE_NAME)\.o/obj-$(CONFIG_88XXAU) += $(MODULE_NAME).o/' "$DRV/Makefile"
          sed -i 's/-Wno-stringop-overread//g; s/-Wno-stringop-overflow//g; s/-Wno-maybe-uninitialized//g' "$DRV/Makefile"
          echo 'EXTRA_CFLAGS += -Wno-error' >> "$DRV/Makefile"
          grep -q 'obj-$(CONFIG_88XXAU)' "$DRV/Makefile" || { echo "ERROR: driver Makefile obj line not patched"; exit 1; }

          # 3. Kconfig / Makefile hooks
          printf 'config 88XXAU\n\ttristate "Realtek 8812A/8821A USB WiFi (aircrack-ng)"\n\tdepends on USB\n' > "$DRV/Kconfig"
          echo 'source "drivers/net/wireless/rtl8812au/Kconfig"' >> common/drivers/net/wireless/Kconfig
          echo 'obj-$(CONFIG_88XXAU) += rtl8812au/' >> common/drivers/net/wireless/Makefile

          # 4. Source compatibility patches for 5.15
          python3 - "$DRV" <<'PY'
          import re, sys
          from pathlib import Path

          drv = Path(sys.argv[1])

          # 4a. stale sta_info auth block in rtw_ap.c
          p = drv / 'core/rtw_ap.c'
          text = p.read_text()
          pattern = r'\s*if\s*\(\s*\(\s*psta\s*->\s*auth_len\s*!=\s*0\s*\)\s*&&\s*\(\s*psta\s*->\s*pauth_frame\s*!=\s*NULL\s*\)\s*\)\s*\{.*?\n\s*\}'
          text, count = re.subn(pattern, '', text, flags=re.DOTALL)
          p.write_text(text)
          print(f"rtw_ap.c stale auth block removed: {count}")

          # 4b. wiphy_net() compat in os_intfs.c
          p = drv / 'os_dep/linux/os_intfs.c'
          text = p.read_text()
          old = "dev_net_set(ndev, wiphy_net(adapter_to_wiphy(adapter)));"
          new = "dev_net_set(ndev, &init_net);"
          if old in text:
              p.write_text(text.replace(old, new))
              print("os_intfs.c wiphy_net patched")

          # 4c. NL80211_AUTHTYPE_SAE stale macro
          h = drv / 'include/rtw_mlme_ext.h'
          if h.exists():
              t = h.read_text()
              t = re.sub(r'#ifndef NL80211_AUTHTYPE_SAE.*?#endif', '', t, flags=re.DOTALL)
              h.write_text(t)
          for f in drv.rglob('*.[ch]'):
              t = f.read_text(errors='surrogateescape')
              if 'NL80211_AUTHTYPE_SAE' in t:
                  f.write_text(t.replace('NL80211_AUTHTYPE_SAE', '0'), errors='surrogateescape')

          # 4d. Remove forbidden file I/O (filp_open / kernel_read / kernel_write).
          # GKI modules must not touch files from kernel space, and the build's
          # forbidden-symbol check rejects them. Each call is replaced by an
          # error value so the driver simply behaves as if the file is missing.
          REPL = {
              "filp_open":    "ERR_PTR(-ENOENT)",
              "kernel_read":  "(-EINVAL)",
              "kernel_write": "(-EINVAL)",
          }

          def strip_calls(text, name, repl):
              pat = re.compile(r'(?<![\w.>])' + name + r'\s*\(')
              out, i, n = [], 0, 0
              while True:
                  m = pat.search(text, i)
                  if not m:
                      out.append(text[i:])
                      break
                  out.append(text[i:m.start()])
                  j, depth = m.end(), 1
                  while j < len(text) and depth:
                      depth += (text[j] == '(') - (text[j] == ')')
                      j += 1
                  out.append(repl)
                  i, n = j, n + 1
              return ''.join(out), n

          total = 0
          for f in sorted(drv.rglob('*.[ch]')):
              t = f.read_text(errors='surrogateescape')
              orig = t
              for name, repl in REPL.items():
                  t, n = strip_calls(t, name, repl)
                  total += n
                  if n:
                      print(f"patched {n}x {name} in {f}")
              if t != orig:
                  f.write_text(t, errors='surrogateescape')
          print(f"forbidden file I/O calls replaced: {total}")
          PY

          echo '--- remaining forbidden calls in driver (should be empty) ---'
          grep -rnE '\b(filp_open|kernel_read|kernel_write)\s*\(' "$DRV" --include='*.c' --include='*.h' || echo "none"

          # 5. Enable in the kernel configs
          FILES=$(grep -rl 'CONFIG_LOCALVERSION="-chickernel' common/arch/arm64/configs common/*.config* 2>/dev/null || true)
          [ -n "$FILES" ] || { echo "ERROR: no config file found"; exit 1; }
          for CFG in $FILES; do
            echo "Patching: $CFG"
            sed -i '/^# CONFIG_SECTION_MISMATCH_WARN_ONLY is not set/d' "$CFG"
            printf '\nCONFIG_88XXAU=m\nCONFIG_CFG80211=y\nCONFIG_SECTION_MISMATCH_WARN_ONLY=y\n' >> "$CFG"
          done

      - name: Build, and process the kernel(s)
        working-directory: kernel-build
        env:
          EXTRA_ARGS: ${{ github.event.inputs.extra_args }}
          FAST_BUILD: ${{ github.event.inputs.fast_build }}
          USE_KLEAF: ${{ github.event.inputs.use_kleaf }}
          OUT_DIR: ${{ github.workspace }}/kernel-build/out
          OUT_BAZEL_DIR: ${{ github.workspace }}/kernel-build/bazel-bin/common
        run: |
          mkdir -p "${FINAL_DIR}"

          for config in ${BUILD_CONFIGS}; do
            echo "Building kernel config: ${config}"

            if [ "${USE_KLEAF}" = true ]; then
              if [ "${FAST_BUILD}" = true ]; then
                tools/bazel build ${EXTRA_ARGS} --config=fast //common:${config}
              else
                tools/bazel build ${EXTRA_ARGS} //common:${config}
              fi

              if [ -f "${OUT_BAZEL_DIR}/${config}/${IMAGE_TYPE}" ]; then
                sudo chmod 777 -R ${OUT_BAZEL_DIR}/${config}
                mv "${OUT_BAZEL_DIR}/${config}/${IMAGE_TYPE}" "${FINAL_DIR}/${IMAGE_TYPE}-${config}"
              else
                echo "Error: Output image not found for ${config}"
                exit 1
              fi
            else
              BUILD_CONFIG=common/${config} bash build/build.sh ${EXTRA_ARGS}

              if [ -f "${OUT_DIR}/dist/${IMAGE_TYPE}" ]; then
                mv "${OUT_DIR}/dist/${IMAGE_TYPE}" "${FINAL_DIR}/${IMAGE_TYPE}-${config}"
              else
                echo "Error: Output image not found for ${config}"
                exit 1
              fi
            fi
          done

      - name: Refresh modules list
        working-directory: kernel-build
        run: |
          set -e
          if [ -f "out/common/modules.order" ]; then
            mkdir -p common/android
            cp -f "out/common/modules.order" "common/android/gki_aarch64_modules"

            MOD_ENTRY='drivers/net/wireless/rtl8812au/88XXau.ko'
            if ! grep -qxF "$MOD_ENTRY" common/android/gki_aarch64_modules; then
              printf '%s\n' "$MOD_ENTRY" >> common/android/gki_aarch64_modules
            fi
            # Add missing kernel symbols to the system DLKM list
            if [ -f "common/android/gki_system_dlkm_modules" ]; then
              for symbol in filp_open ieee80211_radiotap_iterator_init kernel_read kernel_write; do
                if ! grep -qxF "$symbol" common/android/gki_system_dlkm_modules; then
                  printf '%s\n' "$symbol" >> common/android/gki_system_dlkm_modules
                fi
              done
            fi
            python3 - <<'PY'
          from pathlib import Path
          p = Path('common/android/gki_aarch64_modules')
          if p.exists():
            text = p.read_text()
            if not text.endswith('\n'):
              p.write_text(text + '\n')
            print('Ensured trailing newline in gki_aarch64_modules')
          else:
            raise SystemExit('ERROR: common/android/gki_aarch64_modules missing after copy')
          PY
          else
            echo "ERROR: out/common/modules.order not found"
            exit 1
          fi

      - name: Collect 88XXau.ko
        working-directory: kernel-build
        run: |
          KO=$(find out -name '88XXau.ko' | head -n1)
          [ -n "$KO" ] || { echo "ERROR: 88XXau.ko was not built"; exit 1; }
          cp "$KO" "${FINAL_DIR}/88XXau.ko"
          modinfo "${FINAL_DIR}/88XXau.ko" | head -n 12

      - name: Package Kernels with AnyKernel3
        working-directory: kernel-build
        run: |
          for config in ${BUILD_CONFIGS}; do
            if [ -f "${FINAL_DIR}/${IMAGE_TYPE}-${config}" ]; then
              cp -r "${AK3_DIR}" "${AK3_DIR}-${config}"
              cd "${AK3_DIR}-${config}"

              cp "${FINAL_DIR}/${IMAGE_TYPE}-${config}" "${AK3_DIR}-${config}/${IMAGE_TYPE}"
              zip -r9 "${FINAL_DIR}/${config}.zip" * -x .git README.md *placeholder

              cd ..
            fi
          done

      - name: Upload Kernel Packages
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages
          path: |
            kernel-build/final_images/*.zip
            kernel-build/final_images/*.ko
          if-no-files-found: error
          retention-days: 30
